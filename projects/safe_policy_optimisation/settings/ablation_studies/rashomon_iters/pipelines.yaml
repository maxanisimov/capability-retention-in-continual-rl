# Rashomon-set iteration ablation for PSPO: identical to settings/paper_2503_07671/
# except rashomon_n_iters 2000 -> 10000, a fresh rashomon_dir per env (so the
# 2000-iter artifacts are never touched), and the unaffected stages (baselines,
# PPO-Shield) skipped since they don't consume the Rashomon set.
_defaults:
  module: &module projects.safe_policy_optimisation.stages.train_policy_optimisation_pipeline
  runtime: &runtime
    seed: 0
    device: cpu
  shield_synthesis: &shield_synthesis
    init_safety_bound: 0.01
    theta: 1.0e-12
    max_vi_steps: 2000
    granularity: 10
    unsafe_cost_threshold: 0.5
  safety: &safety
    cost_limit: 0.01
  safe_rl_baselines: &safe_rl_baselines
    algorithms:
      - ppo_lagrangian
      - ppo_pid_lagrangian
      - cpo
  training: &training
    total_timesteps: 25000
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    max_grad_norm: 0.5
    ent_coef: 0.0
    vf_coef: 0.5
    cost_gamma: 0.99
    cost_gae_lambda: 0.95
    lagrangian_multiplier_init: 10.0
  rashomon_set: &rashomon_set
    rashomon_n_iters: 10000
    rashomon_checkpoint: 100
    rashomon_batch_size: 500
    certificate_samples: 1000
    # Base-policy architecture; also sets the PSPO actor/critic so it
    # matches the [64, 64] MLP used by every baseline.
    n_hidden: 2
    hidden_dim: 64
  early_stopping: &early_stopping
    early_stop_eval_freq: 0  # 0 disables mid-training early stopping (train to full total_timesteps)
    early_stop_eval_episodes: 100
    early_stop_success_rate: 1.0
    success_reward_threshold: 0.0
  evaluation: &evaluation
    eval_episodes: 100
    shielded_evaluation_policy: unshielded
    rashomon_evaluation_policy: unshielded
  monitoring: &monitoring
    curve_eval_freq: 2048
    curve_eval_episodes: 20
  stages: &stages
    # skip_ppo_policy was dropped from StagesCfg in the structured-settings
    # refactor (c847102); the main and deterministic settings use this same
    # 3-key form. Stage selection is driven by the launcher's per-group CLI
    # skip flags (run_seed_experiments.METHOD_JOBS).
    skip_baselines: true
    skip_shielded_policy: true
    skip_rashomon_policy: false

pipelines:
  media_streaming:
    description: Rashomon 10k-iter ablation - Media Streaming (PSPO only).
    module: *module
    default_task: paper_2503_07671_media_streaming
    output:
      output_dir: projects/safe_policy_optimisation/outputs/paper_2503_07671_rashomon10k/media_streaming
      run_id: paper_2503_07671_media_streaming
    runtime: *runtime
    shield_synthesis:
      <<: *shield_synthesis
      init_safety_bound: 0.001
    safety:
      <<: *safety
      cost_limit: 0.001
      shield_path: projects/safe_policy_optimisation/artifacts/paper_2503_07671/inputs/media_streaming/shield_q.pt
    safe_rl_baselines: *safe_rl_baselines
    training: *training
    rashomon_set:
      <<: *rashomon_set
      rashomon_dir: projects/safe_policy_optimisation/artifacts/ablation_studies/rashomon_iters/10k_sets/media_streaming/rashomon_fullcov
    early_stopping:
      <<: *early_stopping
      success_reward_threshold: -0.5
    evaluation: *evaluation
    monitoring: *monitoring
    stages: *stages

  colour_bomb:
